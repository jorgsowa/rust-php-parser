name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Library-only build, so dev-dependencies do not turn the `serde` feature on.
      - name: Clippy without the serde feature
        run: cargo clippy -p php-ast -p phpdoc-parser -p php-rs-parser -- -D warnings

      - name: Build WASM crate
        run: cargo build -p php-wasm --target wasm32-unknown-unknown

      - name: Rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  minimal-versions:
    name: Minimal versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Resolve minimal direct dependency versions
        run: cargo update -Z direct-minimal-versions

      - name: Check
        run: cargo check --workspace --exclude php-wasm --all-targets

  semver:
    name: Semver
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Flags API breaks against the base branch for review. Breaking changes are
    # allowed before 1.0, so this does not block; the release workflow runs the
    # same check against crates.io and does block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2

      - uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-semver-checks

      - name: Check semver against the base branch
        run: >-
          cargo semver-checks --workspace --exclude php-wasm --exclude ast-stats
          --baseline-rev ${{ github.event.pull_request.base.sha }}

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2.1.1

  php-syntax:
    name: PHP Syntax (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.php-version }}

      # Lints every parser fixture, and every fixture printed for this PHP version, with php -l.
      - name: Check fixtures and printed fixtures with php -l
        run: cargo test --test php_syntax

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.toolchain }})
    needs: php-syntax
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          # MSRV, kept in sync with `rust-version` in Cargo.toml.
          - os: ubuntu-latest
            toolchain: '1.89'
    steps:
      # Fixtures compare byte-for-byte, so stop Git on Windows from rewriting line endings.
      - name: Disable autocrlf
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Unit tests
        run: cargo test --lib --locked

      - name: Doc tests
        run: cargo test --doc --workspace --locked

      - name: Integration tests
        run: cargo test --test integration --locked

      - name: Lexer tests
        run: cargo test --test lexer -p php-lexer --locked

      - name: PHPDoc parser tests
        run: cargo test --test fixtures -p phpdoc-parser --locked

      - name: AST fold tests
        run: cargo test --test fold -p php-ast --locked

  printer:
    name: Printer Tests
    needs: php-syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Run printer tests
        run: cargo test --test printer

      - name: Validate printer output with php -l
        run: ./scripts/validate-printer-output.sh

  coverage:
    name: Coverage
    needs: [test, printer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: coverage

      - uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
