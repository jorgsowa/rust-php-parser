name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --tests -- -D warnings

      - name: Build WASM crate
        run: cargo build -p php-wasm --target wasm32-unknown-unknown

  php-syntax:
    name: PHP Syntax (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.php-version }}

      - name: Check PHP syntax in tests
        run: cargo test --test php_syntax

  test:
    name: Test (PHP ${{ matrix.php-version }})
    needs: php-syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.php-version }}

      - name: Unit tests
        run: cargo test --lib

      - name: Doc tests
        run: cargo test --doc --workspace

      - name: Integration tests
        run: cargo test --test integration

      - name: Lexer tests
        run: cargo test --test lexer -p php-lexer

      - name: PHPDoc parser tests
        run: cargo test --test fixtures -p phpdoc-parser

      - name: AST fold tests
        run: cargo test --test fold -p php-ast

  printer:
    name: Printer Tests
    needs: php-syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run printer tests
        run: cargo test --test printer

      - name: Validate printer output with php -l
        run: ./scripts/validate-printer-output.sh

  coverage:
    name: Coverage
    needs: [test, printer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          fail_ci_if_error: false

  fuzz-smoke:
    name: Fuzz Smoke Test
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz smoke test (10s)
        run: cargo fuzz run fuzz_parse -- -max_total_time=10
