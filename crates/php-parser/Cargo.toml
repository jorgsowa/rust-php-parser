[package]
name = "php-rs-parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Fast PHP parser producing a typed AST"
keywords = ["php", "parser", "ast", "syntax"]
categories = ["parsing", "development-tools", "compilers"]
readme = "README.md"
exclude = ["benches/", "tests/", "examples/", ".gitmodules"]

[dependencies]
php-ast = { workspace = true }
php-lexer = { workspace = true }
phpdoc-parser = { workspace = true }
thiserror = { workspace = true }
bumpalo = { workspace = true }
memchr = { workspace = true }

[dev-dependencies]
# Path-only so `cargo publish` strips it: php-printer dev-depends on this crate.
php-printer = { path = "../php-printer" }
serde = { workspace = true }
serde_json = { workspace = true }
criterion = { workspace = true }
walkdir = { workspace = true }
mimalloc = { workspace = true }
bumpalo = { workspace = true }
pprof = { workspace = true }
rayon = { workspace = true }

[features]
default = []
# Enable lightweight instrumentation for profiling array parsing and expression parsing
instrument = []

[[bench]]
name = "parse"
harness = false

[[example]]
name = "profile_array_parsing"
required-features = ["instrument"]

[[example]]
name = "profile_corpus"
required-features = ["instrument"]

[[example]]
name = "profile_statements"
required-features = ["instrument"]
