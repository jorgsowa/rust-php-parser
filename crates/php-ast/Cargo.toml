[package]
name = "php-ast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PHP Abstract Syntax Tree (AST) node definitions"
keywords = ["php", "ast", "parser", "syntax"]
categories = ["parsing", "development-tools"]
readme = "README.md"
exclude = ["tests/"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { workspace = true, optional = true }
bumpalo = { workspace = true }

[dev-dependencies]
# Self dev-dependency so the crate's own tests see the `serde` feature.
php-ast = { path = ".", features = ["serde"] }
serde_json = { workspace = true }

[features]
default = []
# `Serialize` impls for every AST type and the `fingerprint` module.
serde = ["dep:serde"]
