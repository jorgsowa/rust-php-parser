[package]
name = "phpdoc-parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Structural PHPDoc parser. Parses doc-comment blocks into a tag/prose AST with accurate spans; tag bodies exposed as raw text."
keywords = ["php", "phpdoc", "docblock", "parser"]
categories = ["parsing", "development-tools"]
readme = "README.md"
exclude = ["tests/"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
php-ast = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
# Self dev-dependency so the crate's own tests see the `serde` feature.
phpdoc-parser = { path = ".", features = ["serde"] }
serde_json = { workspace = true }
walkdir    = { workspace = true }
rayon      = { workspace = true }

[features]
default = []
# `Serialize` impls for the docblock AST.
serde = ["dep:serde", "php-ast/serde"]

[[test]]
name = "fixtures"
path = "tests/fixtures.rs"
