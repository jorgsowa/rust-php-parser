[package]
name = "php-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "WebAssembly bindings for the PHP parser and printer"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
php-rs-parser = { workspace = true }
php-printer = { workspace = true }
bumpalo = { workspace = true }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"

[package.metadata.wasm-pack.profile.release]
# --enable-bulk-memory: rustc emits memory.copy/memory.fill for wasm32-unknown-unknown
# by default; wasm-pack's bundled (older) wasm-opt doesn't enable that proposal on its own.
wasm-opt = ["-Oz", "--enable-bulk-memory"]
